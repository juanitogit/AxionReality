    <path d="M0 -100 L86 -50 L86 50 L0 100 L-86 50 L-86 -50 Z" fill="none" stroke="#00E559" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M0 -100 L0 0 L86 -50 M0 0 L-86 -50 M0 0 L0 100" fill="none" stroke="#00E559" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#00E559" />
    <circle cx="0" cy="-100" r="4" fill="#00E559" />
    <circle cx="86" cy="-50" r="4" fill="#00E559" />
    <circle cx="86" cy="50" r="4" fill="#00E559" />
    <circle cx="0" cy="100" r="4" fill="#00E559" />
    <circle cx="-86" cy="50" r="4" fill="#00E559" />
    <circle cx="-86" cy="-50" r="4" fill="#00E559" />
  </g>
  <defs>
