<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaru — Replicado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
  
  /* Contenedor del Video */
  .video-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    opacity: 0.8; /* Ligeramente oscurecido para destacar el texto, como en el original */
    transform: scale(1.05); /* Pequeño zoom para un efecto inmersivo */
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Asegura que el video cubra toda la pantalla sin distorsionarse */
  }

  /* Capa de oscurecimiento (opcional) */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: 2;
  }

  /* Textos superpuestos (HUD) */
  #hud {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 50px;
    pointer-events: none;
    z-index: 3;
  }

  #hud h1 {
    font-size: clamp(14px, 2vw, 24px);
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  #hud p {
    font-size: clamp(9px, 1vw, 12px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }

  /* Etiqueta superior (opcional) */
  .top-label {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #EBFB10; /* Color lima del sitio de Aaru */
    text-transform: uppercase;
    z-index: 3;
    background: rgba(0,0,0,0.4);
    padding: 8px 16px;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <!-- Etiqueta superior similar a la que tiene Aaru -->
  <div class="top-label">AARU REPLICA - SIMULATE ANY DECISION</div>

  <!-- Video de Fondo Extraído de Aaru.com -->
  <div class="video-container">
    <video loop muted playsinline autoplay poster="https://cdn.aaru.com/website/hero-poster.webp">
      <source src="https://cdn.aaru.com/website/hero.webm" type="video/webm">
      <source src="https://cdn.aaru.com/website/hero.mp4" type="video/mp4">
      Tu navegador no soporta el formato de video.
    </video>
  </div>
  
  <div class="overlay"></div>

  <!-- HUD Original -->
  <div id="hud">
    <h1>Rendering human granularity</h1>
    <p>Simulate any decision</p>
  </div>

</body>
</html>
